name: Apply theme
on:
  push:
    paths: ["active-theme.txt", "themes/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/switch-theme.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: apply theme $(cat active-theme.txt)" && git push)
